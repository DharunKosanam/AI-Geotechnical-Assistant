[pytest]
# Pytest configuration for FastAPI testing

# Async configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test discovery
python_files = tests/test_*.py test_*.py
python_classes = Test*
python_functions = test_*

# Output options
# test_e2e.py is a standalone live-server harness (run: python tests/integration/
# test_e2e.py), not a pytest module -- exclude it from collection so it never
# errors on its missing `client` fixture.
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --ignore=tests/integration/test_e2e.py

# Markers
markers =
    asyncio: Mark test as async
    slow: Mark test as slow
    integration: Mark test as integration test
    unit: Mark test as unit test

# Logging
log_cli = false
log_cli_level = INFO

# Default run = the unit suite only: fast, deterministic, no DB / Groq / live
# server, so `pytest` is a clean green/red signal for the Problem 1-5 logic.
# Integration tests are opt-in:  pytest tests/integration
testpaths = tests/unit
